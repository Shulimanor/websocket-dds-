<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON 查看器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --border: #d8dde5;
  --text: #1f2329;
  --muted: #7a8494;
  --accent: #2f6fed;
  --accent-soft: #e8f0fe;
  --danger: #d93026;
  --key: #8250df;
  --string: #0c7d3c;
  --number: #b45309;
  --bool: #0e7490;
  --null: #8a8f98;
  --punct: #6b7280;
}
html, body { height: 100%; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
header h1 {
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  margin-right: 10px; white-space: nowrap;
}
.logo {
  width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(135deg, #2f6fed, #7c3aed);
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; font-weight: 700;
}
.hint { font-size: 12px; color: var(--muted); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.grow { flex: 1; }
.btn {
  border: 1px solid var(--border);
  background: #fff; color: var(--text);
  padding: 5px 12px; font-size: 12px; border-radius: 6px;
  cursor: pointer; transition: all .12s;
  font-family: inherit;
}
.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #2458d8; color: #fff; }
main {
  flex: 1; display: flex; gap: 12px; padding: 12px 16px;
  min-height: 0;
}
.panel {
  flex: 1; min-width: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel-head {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
}
.panel-head .title { font-weight: 600; color: var(--text); }
.tabs { display: flex; gap: 2px; }
.tab {
  padding: 4px 12px; font-size: 12px; border-radius: 6px;
  cursor: pointer; color: var(--muted);
  border: 1px solid transparent;
  user-select: none;
}
.tab:hover { color: var(--accent); }
.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.opt { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
#inputBox {
  flex: 1; border: none; outline: none; resize: none;
  padding: 12px 14px;
  font-family: Consolas, "Courier New", "Microsoft YaHei", monospace;
  font-size: 13px; line-height: 1.6;
  color: var(--text); background: transparent;
}
#inputBox::placeholder { color: #b3bac6; }
.drop-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: #f7faff; }
.file-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--muted);
}
#fileInput { display: none; }
#output { flex: 1; overflow: auto; padding: 12px 14px; min-height: 0; }
#treeView, #textView {
  font-family: Consolas, "Courier New", "Microsoft YaHei", monospace;
  font-size: 13px; line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
}
#errorBox {
  color: var(--danger);
  font-family: Consolas, "Courier New", monospace;
  font-size: 13px; line-height: 1.7;
  white-space: pre-wrap;
}
#statusBar {
  padding: 6px 12px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--muted);
  display: flex; gap: 16px; flex-wrap: wrap;
}
#statusBar b { color: var(--text); font-weight: 600; }
/* tree tokens */
.tk-key { color: var(--key); }
.tk-str { color: var(--string); }
.tk-num { color: var(--number); }
.tk-bool { color: var(--bool); }
.tk-null { color: var(--null); }
.tk-punct { color: var(--punct); }
.toggle { display: inline-block; width: 14px; color: var(--punct); cursor: pointer; user-select: none; }
.node-row { cursor: pointer; border-radius: 3px; }
.node-row:hover { background: #f4f7fb; }
.children { padding-left: 16px; }
.str-inline { white-space: pre-wrap; }
.tk-json-tag {
  display: inline-block; margin-left: 6px; padding: 1px 7px;
  font-size: 11px; line-height: 1.6; border-radius: 4px;
  color: #fff; background: var(--accent); vertical-align: middle;
  cursor: pointer; user-select: none;
}
.tk-json-preview { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1><span class="logo">J</span>JSON 查看器</h1>
  <span class="hint">支持格式化输出；字符串中的 \n 可还原为换行显示</span>
  <span class="grow"></span>
  <button class="btn" id="btnOpen">打开文件</button>
  <button class="btn" id="btnSample">示例</button>
  <button class="btn" id="btnClear">清空</button>
  <button class="btn primary" id="btnFormat">格式化</button>
</header>

<main>
  <section class="panel" id="inputPanel">
    <div class="panel-head"><span class="title">输入</span><span style="margin-left:auto">Ctrl+Enter 快速格式化</span></div>
    <textarea id="inputBox" spellcheck="false" placeholder='在此粘贴 JSON 内容，或直接拖入 / 选择 .json 文件&#10;例如：{"name": "demo", "msg": "第一行\n第二行"} 中的 \n 会被还原为换行'></textarea>
    <div class="file-row">
      <input type="file" id="fileInput" accept=".json,.txt,application/json">
      <label class="btn" for="fileInput" style="display:inline-block">选择文件</label>
      <span id="fileName">支持拖拽 .json 文件到本区域</span>
    </div>
  </section>

  <section class="panel" id="outputPanel">
    <div class="panel-head">
      <span class="title">输出</span>
      <span class="grow"></span>
      <div class="tabs" id="tabs">
        <div class="tab active" data-view="tree">树形</div>
        <div class="tab" data-view="text">格式化文本</div>
      </div>
      <label class="opt" title="格式化文本视图中将字符串值里的 \n 还原为真实换行">
        <input type="checkbox" id="optNewline" checked> \n → 换行
      </label>
      <label class="opt" title="树形视图中数组节点默认展开（不勾选则默认折叠）">
        <input type="checkbox" id="optArrExpand"> 数组展开
      </label>
      <label class="opt" title="数组展开后显示元素索引（0、1、2…），不勾选则直接显示元素值">
        <input type="checkbox" id="optArrIndex"> 显示索引
      </label>
      <label class="opt" title="较短数组在节点行内直接预览元素值，如 [1, 2, 3]，点击可展开为列表">
        <input type="checkbox" id="optArrInline" checked> 内联预览
      </label>
      <label class="opt" title='粘贴带 \" 转义的日志文本（如 {"a":1}）时，解析失败后自动把 \" 还原为 " 再重试，不影响合法 JSON'>
        <input type="checkbox" id="optFixEsc" checked> 自动清洗转义
      </label>
      <button class="btn" id="btnExpand">全部展开</button>
      <button class="btn" id="btnCollapse">全部折叠</button>
      <button class="btn" id="btnCopy">复制</button>
    </div>
    <div id="output">
      <div id="treeView"></div>
      <div id="textView" style="display:none"></div>
      <div id="errorBox" style="display:none"></div>
    </div>
    <div id="statusBar"><span>就绪：粘贴 JSON 后点击「格式化」</span></div>
  </section>
</main>

<script>
"use strict";

var PLACEHOLDER = "\u0001";
var current = null;
var currentRaw = "";
var currentView = "tree";
/* 数组展示开关状态（树形视图） */
var arrExpandOn = false;   /* 数组默认展开 */
var arrIndexOn = false;    /* 数组展开后显示索引键 */
var arrInlineOn = true;    /* 短数组节点行内预览 */

function $(id) { return document.getElementById(id); }
var inputBox = $("inputBox"), treeView = $("treeView"), textView = $("textView"),
    errorBox = $("errorBox"), statusBar = $("statusBar"), output = $("output");

/* ---------------- parse ---------------- */
function parse(text) { return JSON.parse(text); }

/* 日志 repr 转义清洗：把 \" 还原为 "，仅用于解析失败后的重试 */
function cleanEscaped(text) { return text.replace(/\\"/g, '"'); }

function formatError(raw, err) {
  var m = /position (\d+)/.exec(err && err.message ? err.message : "");
  if (m) {
    var pos = +m[1];
    var before = raw.slice(0, pos);
    var lines = raw.split("\n");
    var line = before.split("\n").length;
    var col = pos - before.lastIndexOf("\n");
    var lineText = lines[line - 1] || "";
    var caret = new Array(Math.max(col, 1)).join(" ") + "^";
    return "JSON 解析错误（第 " + line + " 行，第 " + col + " 列）\n" + lineText + "\n" + caret + "\n" + (err.message || err);
  }
  return "JSON 解析错误：" + (err && err.message ? err.message : err);
}

/* ---------------- text view ---------------- */
function markNewlines(node) {
  if (Array.isArray(node)) return node.map(markNewlines);
  if (node && typeof node === "object") {
    var out = {};
    Object.keys(node).forEach(function (k) { out[k] = markNewlines(node[k]); });
    return out;
  }
  if (typeof node === "string") return node.replace(/\n/g, PLACEHOLDER);
  return node;
}

function textViewText(data, indent, newline) {
  var text;
  if (newline) {
    text = JSON.stringify(markNewlines(data), null, indent).replace(/\\u0001/g, "\n");
  } else {
    text = JSON.stringify(data, null, indent);
  }
  return text;
}

/* ---------------- tree view ---------------- */
function isCollapsible(v) { return v !== null && typeof v === "object"; }

/* 字符串值若是合法 JSON（对象/数组），返回解析结果；否则返回 null */
function parseEmbedded(v) {
  if (typeof v !== "string") return null;
  var t = v.trim();
  if (t.charAt(0) !== "{" && t.charAt(0) !== "[") return null;
  try {
    var x = JSON.parse(t);
    return x !== null && typeof x === "object" ? x : null;
  } catch (e) {
    return null;
  }
}

function countNodes(v) {
  var emb = parseEmbedded(v);
  if (emb !== null) {
    var n = 1;
    var items = Array.isArray(emb) ? emb : Object.keys(emb).map(function (k) { return emb[k]; });
    for (var i = 0; i < items.length; i++) n += countNodes(items[i]);
    return n;
  }
  if (!isCollapsible(v)) return 1;
  var n2 = 1;
  var items2 = Array.isArray(v) ? v : Object.keys(v).map(function (k) { return v[k]; });
  for (var j = 0; j < items2.length; j++) n2 += countNodes(items2[j]);
  return n2;
}

function maxDepth(v, d) {
  var emb = parseEmbedded(v);
  if (emb !== null) {
    var items = Array.isArray(emb) ? emb : Object.keys(emb).map(function (k) { return emb[k]; });
    var md = d;
    for (var i = 0; i < items.length; i++) {
      var dd = maxDepth(items[i], d + 1);
      if (dd > md) md = dd;
    }
    return md;
  }
  if (!isCollapsible(v)) return d;
  var items2 = Array.isArray(v) ? v : Object.keys(v).map(function (k) { return v[k]; });
  var md2 = d;
  for (var j = 0; j < items2.length; j++) {
    var dd2 = maxDepth(items2[j], d + 1);
    if (dd2 > md2) md2 = dd2;
  }
  return md2;
}

function leafClass(v) {
  if (v === null) return "tk-null";
  if (typeof v === "string") return "tk-str";
  if (typeof v === "number") return "tk-num";
  return "tk-bool";
}

/* 内联预览：短数组在节点行内直接展示元素 */
var ARR_INLINE_MAX = 8;        /* 超过该长度的数组不预览 */
var INLINE_TEXT_MAX = 84;      /* 预览文本最大长度 */

function compactVal(v) {
  if (v === null) return "null";
  var t = typeof v;
  if (t === "number" || t === "boolean") return String(v);
  if (t === "string") {
    var s = v.length > 16 ? v.slice(0, 16) + "\u2026" : v;
    return "\u201c" + s + "\u201d";
  }
  if (Array.isArray(v)) return "[" + v.length + "]";
  return "{" + Object.keys(v).length + "}";
}

function inlinePreview(arr) {
  if (arr.length > ARR_INLINE_MAX) return null;
  var parts = [];
  for (var i = 0; i < arr.length; i++) parts.push(compactVal(arr[i]));
  var text = "[" + parts.join(", ") + "]";
  if (text.length > INLINE_TEXT_MAX) {
    text = text.slice(0, INLINE_TEXT_MAX) + "\u2026]";
  }
  return text;
}

function buildNode(v, key) {
  var wrap = document.createElement("div");
  wrap.className = "node";

  var row = document.createElement("div");
  row.className = "node-row";

  var toggle = document.createElement("span");
  toggle.className = "toggle";

  var collapsible = isCollapsible(v);

  if (key !== null) {
    var k = document.createElement("span");
    k.className = "tk-key";
    k.textContent = JSON.stringify(String(key));
    row.appendChild(k);
    var colon = document.createElement("span");
    colon.className = "tk-punct";
    colon.textContent = ": ";
    row.appendChild(colon);
  }

  var children = document.createElement("div");
  children.className = "children";
  children.style.display = collapsible ? "block" : "none";
  /* 层级缩进由 .children 的 padding-left 提供：每层 16px，层级越深缩进越大；
     不再内联覆盖为 0，否则所有层级会平铺无缩进 */

  var embedded = parseEmbedded(v);
  if (embedded !== null) {
    /* 内嵌 JSON 字符串：默认折叠为摘要 + JSON 标签，展开后递归展示结构 */
    toggle.textContent = "\u25b8";
    var maxLen = 100;
    var shown = typeof v === "string" && v.length > maxLen ? v.slice(0, maxLen) + "\u2026" : v;
    var val = document.createElement("span");
    val.className = "tk-str tk-json-preview";
    val.textContent = "\u201c" + shown + "\u201d";
    row.appendChild(toggle);
    row.appendChild(val);
    var tag = document.createElement("span");
    tag.className = "tk-json-tag";
    tag.textContent = "\u25b8 JSON";
    row.appendChild(tag);
    children.style.display = "none";
    children.appendChild(buildNode(embedded, null));
    wrap.appendChild(row);
    wrap.appendChild(children);
    return wrap;
  }

  if (!collapsible) {
    toggle.textContent = "";
    var val = document.createElement("span");
    val.className = leafClass(v);
    if (typeof v === "string") {
      val.textContent = "\u201c" + v + "\u201d";
      val.style.whiteSpace = "pre-wrap";
    } else {
      val.textContent = v === null ? "null" : String(v);
    }
    row.appendChild(toggle);
    row.appendChild(val);
    wrap.appendChild(row);
    return wrap;
  }

  toggle.textContent = "\u25be";
  var isArr = Array.isArray(v);
  var keys = isArr ? null : Object.keys(v);
  var items = isArr ? v : keys.map(function (k) { return v[k]; });
  var sum = document.createElement("span");
  sum.className = "tk-punct";
  if (isArr) {
    /* 数组节点：初始展开状态由「数组展开」开关决定；短数组支持行内预览 */
    if (arrExpandOn) {
      children.style.display = "block";
    } else {
      children.style.display = "none";
      toggle.textContent = "\u25b8";
    }
    var preview = arrInlineOn ? inlinePreview(v) : null;
    sum.textContent = preview !== null ? preview : "[" + items.length + "]";
    if (preview !== null) sum.style.whiteSpace = "pre-wrap";
  } else {
    sum.textContent = "{" + items.length + "}";
  }
  row.appendChild(toggle);
  row.appendChild(sum);
  wrap.appendChild(row);
  wrap.appendChild(children);

  if (isArr) {
    for (var i = 0; i < items.length; i++) {
      /* 「显示索引」开关：开启时带 "i" 键，关闭时直接显示元素值 */
      children.appendChild(buildNode(items[i], arrIndexOn ? i : null));
    }
  } else {
    for (var j = 0; j < keys.length; j++) children.appendChild(buildNode(items[j], keys[j]));
  }
  return wrap;
}

function renderTree(data) {
  arrExpandOn = $("optArrExpand").checked;
  arrIndexOn = $("optArrIndex").checked;
  arrInlineOn = $("optArrInline").checked;
  treeView.innerHTML = "";
  treeView.appendChild(buildNode(data, null));
}

/* ---------------- actions ---------------- */
function format() {
  var raw = inputBox.value;
  if (!raw.trim()) { showError("请输入 JSON 内容"); return; }
  var t0 = performance.now();
  var used = raw;
  var cleaned = false;
  var data;
  try {
    data = parse(used);
  } catch (err) {
    /* 自动清洗转义开关开启且文本含 \" 时，解析失败后先还原转义再重试；仍失败则报原始文本的错误位置 */
    if ($("optFixEsc").checked && raw.indexOf('\\"') !== -1) {
      used = cleanEscaped(raw);
      cleaned = true;
      try { data = parse(used); }
      catch (err2) { showError(formatError(raw, err)); return; }
    } else {
      showError(formatError(raw, err));
      return;
    }
  }
  current = data;
  currentRaw = used;
  renderTree(data);
  refreshTextView();
  showOutput("tree");
  var ms = (performance.now() - t0).toFixed(1);
  statusBar.innerHTML = "<span>解析耗时 <b>" + ms + " ms</b></span>" +
    "<span>节点数 <b>" + countNodes(data) + "</b></span>" +
    "<span>最大深度 <b>" + maxDepth(data, 1) + "</b></span>" +
    "<span>字符数 <b>" + used.length + "</b></span>" +
    "<span>模式 <b>" + ($("optNewline").checked ? "\\n 已还原为换行" : "标准 JSON") + "</b></span>" +
    (cleaned ? "<span style='color:var(--success)'>\u2713 已自动清洗转义</span>" : "");
}

function showOutput(view) {
  currentView = view;
  var isTree = view === "tree";
  treeView.style.display = isTree ? "" : "none";
  textView.style.display = isTree ? "none" : "";
  errorBox.style.display = "none";
  var tabs = document.querySelectorAll("#tabs .tab");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle("active", tabs[i].getAttribute("data-view") === view);
  }
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = "";
  treeView.style.display = "none";
  textView.style.display = "none";
  statusBar.innerHTML = '<span style="color:var(--danger)">解析失败，请检查 JSON 输入</span>';
}

function refreshTextView() {
  if (current === null) return;
  textView.textContent = textViewText(current, 2, $("optNewline").checked);
}

function collapseAll(collapsed) {
  var toggles = treeView.querySelectorAll(".toggle");
  for (var i = 0; i < toggles.length; i++) {
    var parent = toggles[i].closest(".node");
    var ch = parent.querySelector(":scope > .children");
    if (!ch) continue;
    if (collapsed) {
      ch.style.display = "none";
      toggles[i].textContent = "\u25b8";
    } else {
      ch.style.display = "block";
      toggles[i].textContent = "\u25be";
    }
  }
}

/* ---------------- events ---------------- */
$("btnFormat").addEventListener("click", format);
inputBox.addEventListener("keydown", function (e) {
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); format(); }
});

$("btnSample").addEventListener("click", function () {
  inputBox.value = JSON.stringify({
    name: "JSON 查看器示例",
    version: "1.0",
    enabled: true,
    null_value: null,
    percent: 87.5,
    features: ["格式化", "树形折叠", "语法高亮", "文件拖拽"],
    message: "这是一段包含换行的文本：\n第一行\n第二行\n第三行",
    nested: { level2: { level3: { tip: "点击行头可折叠/展开子节点" } } }
  }, null, null);
  format();
});

$("btnClear").addEventListener("click", function () {
  inputBox.value = "";
  current = null;
  currentRaw = "";
  treeView.innerHTML = "";
  textView.textContent = "";
  errorBox.style.display = "none";
  treeView.style.display = "";
  textView.style.display = "none";
  statusBar.innerHTML = "<span>就绪：粘贴 JSON 后点击「格式化」</span>";
});

$("optNewline").addEventListener("change", function () {
  refreshTextView();
  if (current !== null) statusBar.innerHTML = statusBar.innerHTML.replace(/模式 <b>.*?<\/b>/, "模式 <b>" + (this.checked ? "\\n 已还原为换行" : "标准 JSON") + "</b>");
});

/* 数组展示开关：变化后立即按当前数据重渲染树形视图 */
["optArrExpand", "optArrIndex", "optArrInline"].forEach(function (id) {
  $(id).addEventListener("change", function () {
    if (current !== null && currentView === "tree") renderTree(current);
  });
});

var tabs = document.querySelectorAll("#tabs .tab");
for (var ti = 0; ti < tabs.length; ti++) {
  tabs[ti].addEventListener("click", function () { showOutput(this.getAttribute("data-view")); });
}

$("btnExpand").addEventListener("click", function () { collapseAll(false); });
$("btnCollapse").addEventListener("click", function () { collapseAll(true); });

treeView.addEventListener("click", function (e) {
  var row = e.target.closest(".node-row");
  if (!row) return;
  var toggle = row.querySelector(".toggle");
  if (!toggle || !toggle.textContent) return;
  var node = row.closest(".node");
  var ch = node.querySelector(":scope > .children");
  var collapsed = ch.style.display === "none";
  ch.style.display = collapsed ? "block" : "none";
  toggle.textContent = collapsed ? "\u25be" : "\u25b8";
});

$("btnCopy").addEventListener("click", function () {
  var text = currentView === "tree" ? treeView.innerText : textView.textContent;
  if (!text) return;
  var done = false;
  function finish() { if (!done) { done = true; flashCopy(); } }
  function legacyCopy() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    finish();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish, legacyCopy);
    setTimeout(function () { if (!done) legacyCopy(); }, 1500);
  } else {
    legacyCopy();
  }
});

function flashCopy() {
  var b = $("btnCopy");
  var old = b.textContent;
  b.textContent = "已复制";
  setTimeout(function () { b.textContent = old; }, 1200);
}

/* file input */
$("fileInput").addEventListener("change", function (e) {
  var f = e.target.files && e.target.files[0];
  if (f) readFile(f);
});

/* drag & drop */
var inputPanel = $("inputPanel");
inputPanel.addEventListener("dragover", function (e) {
  e.preventDefault();
  inputPanel.classList.add("drop-over");
});
inputPanel.addEventListener("dragleave", function () { inputPanel.classList.remove("drop-over"); });
inputPanel.addEventListener("drop", function (e) {
  e.preventDefault();
  inputPanel.classList.remove("drop-over");
  var f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) readFile(f);
});

function readFile(file) {
  $("fileName").textContent = file.name + "（" + file.size + " 字节）";
  var reader = new FileReader();
  reader.onload = function () {
    inputBox.value = String(reader.result || "");
    format();
  };
  reader.readAsText(file, "utf-8");
}

$("btnOpen").addEventListener("click", function () { $("fileInput").click(); });
</script>
</body>
</html>
